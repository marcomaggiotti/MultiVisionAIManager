<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VLM Module</title>
<style>
  :root { --bg:#f7f7f5; --fg:#1d1d1b; --muted:#6b6b66; --card:#fff; --line:#e3e3de; --accent:#a4572a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161615; --fg:#ecebe6; --muted:#a3a29b; --card:#212120; --line:#34342f; --accent:#e7a273; } }
  * { box-sizing:border-box } body { margin:0; font:14px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--fg) }
  main { max-width:1000px; margin:0 auto; padding:16px } h1 { font-size:20px; margin:4px 0 } .muted { color:var(--muted) }
  .grid { display:grid; grid-template-columns: 360px 1fr; gap:16px } @media (max-width:800px){ .grid{grid-template-columns:1fr} }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px }
  label { display:block; margin:10px 0 4px; font-weight:600 } textarea, select, input[type=number] { width:100%; padding:6px; border:1px solid var(--line); border-radius:6px; background:transparent; color:inherit; font:inherit }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:8px 14px; cursor:pointer; margin-top:12px }
  .thumbs img { height:90px; border-radius:6px; margin:0 6px 6px 0 } #answer { white-space:pre-wrap } a { color:var(--accent) }
</style>
</head>
<body>
<main>
  <h1>Vision-language model module</h1>
  <p class="muted" id="model">Loading…</p>
  <p class="muted">Standalone page of this module. The MultiVision AI Manager adds model selection, decoding comparison, tokenization and attention views, instruction tuning and evaluation · <a href="../docs">API docs</a></p>
  <div class="grid">
    <div class="card">
      <label>Pictures (one, or a sequence in order)</label><input type="file" id="files" accept="image/*" multiple>
      <label>Preset</label><select id="preset"></select>
      <label>Prompt</label><textarea id="prompt" rows="4"></textarea>
      <label>Max new tokens</label><input type="number" id="maxtok" value="200" min="1" max="2048">
      <label><input type="checkbox" id="sample"> Sampling (temperature 0.7)</label>
      <button id="run">Ask</button>
    </div>
    <div class="card"><div class="thumbs" id="thumbs"></div><div id="answer"></div><p class="muted" id="stats"></p></div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let presets = {};
async function init() {
  presets = await (await fetch("../v1/presets")).json();
  for (const k of Object.keys(presets.prompts)) $("preset").add(new Option(k, k));
  $("prompt").value = presets.prompts.describe;
  const r = await fetch("../v1/model");
  $("model").textContent = r.ok ? (await r.json()).model_id : "No model loaded";
}
$("preset").onchange = () => $("prompt").value = presets.prompts[$("preset").value];
$("files").onchange = () => { $("thumbs").innerHTML = ""; for (const f of $("files").files) { const i = new Image(); i.src = URL.createObjectURL(f); $("thumbs").append(i); } };
$("run").onclick = async () => {
  const fd = new FormData(); for (const f of $("files").files) fd.append("images", f);
  fd.append("prompt", $("prompt").value); fd.append("system", presets.system); fd.append("sequence", $("files").files.length > 1);
  fd.append("params", JSON.stringify({ max_new_tokens: +$("maxtok").value, do_sample: $("sample").checked }));
  $("answer").textContent = "Thinking…";
  const res = await fetch("../v1/generate", { method: "POST", body: fd }); const body = await res.json();
  $("answer").textContent = res.ok ? body.text : body.detail;
  if (res.ok) $("stats").textContent = `${body.image_tokens} image tokens · ${body.new_tokens} new tokens · ${body.latency_ms} ms · ${body.tokens_per_s} tok/s`;
};
init();
</script>
</body>
</html>
