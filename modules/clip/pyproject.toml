[project]
name = "clip-module"
version = "0.1.0"
description = "CLIP / SigLIP module of the MultiVision AI Manager"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
    "numpy>=1.26",
    "torch>=2.6",  # transformers refuses older PyTorch
    "transformers>=4.56,<6",
    "sentencepiece>=0.2",
    "protobuf>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
