# Shared by the HTTP and HTTPS servers (nginx.conf).
root /usr/share/nginx/html;
client_max_body_size 200m;

# WebSockets: the live studio (/api/live/ws) and Compare (/api/compare/ws), and any
# later /api/<name>/ws. Without the Upgrade headers the browser cannot connect.
location ~ ^/api/[a-z-]+/ws$ {
    proxy_pass http://manager-api:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# Video library and cutting: whole video files go up.
location /api/videos {
    client_max_body_size 4g;
    proxy_pass http://manager-api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
}

# Manager API (and, through it, every module's API and page).
location /api/ {
    proxy_pass http://manager-api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
}

location = /health { proxy_pass http://manager-api:8080/health; }

# Single-page app: every other path serves index.html. index.html is never cached (a
# rebuilt app shows at the next reload); the assets it names are hashed, cached for good.
location / {
    try_files $uri /index.html;
}
location = /index.html {
    add_header Cache-Control "no-cache";
}
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
}
