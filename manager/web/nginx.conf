server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 200m;

    # Real-time studio: WebSocket frames.
    location /api/live/ws {
        proxy_pass http://manager-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Manager API (and, through it, every module's API and page).
    location /api/ {
        proxy_pass http://manager-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location = /health { proxy_pass http://manager-api:8080/health; }

    # Single-page app: every other path serves index.html.
    location / {
        try_files $uri /index.html;
    }
}
