<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="980" viewBox="0 0 1280 980" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34405a"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2652e"/>
    </marker>
    <style>
      .title { font-size: 22px; font-weight: 700; fill: #1d2433; }
      .h { font-size: 15px; font-weight: 700; fill: #1d2433; }
      .t { font-size: 12.5px; fill: #34405a; }
      .s { font-size: 11px; fill: #5b6680; }
      .mono { font-family: Consolas, Menlo, monospace; font-size: 11.5px; fill: #34405a; }
      .lbl { font-size: 11px; fill: #34405a; font-weight: 600; }
    </style>
  </defs>
  <rect width="1280" height="980" fill="#ffffff"/>
  <text x="40" y="44" class="title">MultiVision AI Manager · Docker Compose architecture</text>
  <text x="40" y="66" class="s">Every module is a separate web service in its own container. The manager is the hub: it launches, monitors, proxies and orchestrates them.</text>

  <!-- clients -->
  <rect x="40" y="92" width="250" height="96" rx="12" fill="#eef3fb" stroke="#4f7cc0"/>
  <text x="58" y="118" class="h">Browser on this computer</text>
  <text x="58" y="140" class="mono">http://localhost:3000</text>
  <text x="58" y="160" class="s">Live studio · Sessions · Analysis</text>
  <text x="58" y="176" class="s">Modules · YOLO / CLIP / VLM studios</text>
  <rect x="320" y="92" width="250" height="96" rx="12" fill="#eef3fb" stroke="#4f7cc0"/>
  <text x="338" y="118" class="h">Phone / tablet (same Wi-Fi)</text>
  <text x="338" y="140" class="mono">https://&lt;pc-ip&gt;:3443</text>
  <text x="338" y="160" class="s">HTTPS: needed for the camera</text>
  <text x="338" y="176" class="s">(self-signed certificate)</text>

  <!-- host -->
  <rect x="20" y="210" width="1240" height="750" rx="16" fill="#f7f8fa" stroke="#9aa4b8" stroke-dasharray="6 5"/>
  <text x="40" y="236" class="h">Host computer · Docker Engine (+ NVIDIA Container Toolkit for the GPU)</text>
  <!-- compose project -->
  <rect x="40" y="250" width="1200" height="530" rx="14" fill="#ffffff" stroke="#34405a"/>
  <text x="58" y="276" class="h">Compose project "multivision" · network multivision_default (containers reach each other by service name)</text>

  <!-- web -->
  <rect x="60" y="300" width="300" height="150" rx="12" fill="#e9effa" stroke="#4f7cc0" stroke-width="1.5"/>
  <text x="78" y="326" class="h">web</text>
  <text x="128" y="326" class="s">nginx · build: manager/web (React, Vite)</text>
  <text x="78" y="350" class="t">Serves the web app; forwards /api/*</text>
  <text x="78" y="368" class="t">and the WebSocket /api/live/ws</text>
  <text x="78" y="392" class="mono">ports 3000→80 (http)</text>
  <text x="78" y="410" class="mono">      3443→443 (https)</text>
  <text x="78" y="434" class="s">volume web-certs → /etc/nginx/certs</text>

  <!-- manager-api -->
  <rect x="420" y="300" width="420" height="200" rx="12" fill="#e9effa" stroke="#2f5f8a" stroke-width="2"/>
  <text x="438" y="326" class="h">manager-api</text>
  <text x="540" y="326" class="s">FastAPI · build: manager/api</text>
  <text x="438" y="350" class="t">Module registry &amp; health · launcher (start / stop / idle stop)</text>
  <text x="438" y="368" class="t">Reverse proxy  /api/modules/&lt;name&gt;/…</text>
  <text x="438" y="386" class="t">Live sessions (WebSocket): ballet recognition + feedback</text>
  <text x="438" y="404" class="t">Analysis pipeline: YOLO → CLIP → VLM → fusion</text>
  <text x="438" y="428" class="mono">port 127.0.0.1:8080→8080</text>
  <text x="438" y="448" class="s">volume manager-data → /data  (SQLite history, pictures)</text>
  <text x="438" y="466" class="s">bind ./modules.json → /config/modules.json (read-only)</text>
  <text x="438" y="484" class="s">bind /var/run/docker.sock (to launch the modules)</text>

  <!-- docker engine -->
  <rect x="900" y="300" width="320" height="120" rx="12" fill="#fbeee6" stroke="#c2652e" stroke-width="1.5"/>
  <text x="918" y="326" class="h">Docker Engine API</text>
  <text x="918" y="350" class="t">/var/run/docker.sock</text>
  <text x="918" y="370" class="t">find containers by Compose labels,</text>
  <text x="918" y="388" class="t">start · stop · logs</text>
  <text x="918" y="408" class="s">(root-equivalent: API kept on localhost)</text>

  <!-- modules -->
  <rect x="60" y="540" width="370" height="220" rx="12" fill="#e8f5ee" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="78" y="566" class="h">yolo</text>
  <text x="122" y="566" class="s">build: modules/yolo (git submodule)</text>
  <text x="78" y="586" class="s">= github.com/marcomaggiotti/detect_image_engine</text>
  <text x="78" y="610" class="t">Detection &amp; 17-keypoint pose (YOLO11n-pose)</text>
  <text x="78" y="628" class="t">Lab: datasets, annotation, training jobs,</text>
  <text x="78" y="646" class="t">robustness, latency, export</text>
  <text x="78" y="672" class="mono">port 127.0.0.1:8001→8000 · /ui/ · /docs</text>
  <text x="78" y="692" class="s">volume yolo-data → /data (datasets, runs, weights)</text>
  <text x="78" y="712" class="s">GPU reservation · shm 2 GB</text>
  <text x="78" y="740" class="lbl">API: /v1/detect · /v1/model · /v1/lab/…</text>

  <rect x="455" y="540" width="370" height="220" rx="12" fill="#f0ecfb" stroke="#5b4bb7" stroke-width="1.5"/>
  <text x="473" y="566" class="h">clip</text>
  <text x="513" y="566" class="s">build: modules/clip</text>
  <text x="473" y="590" class="t">CLIP / SigLIP dual encoder (ViT-B/16 default)</text>
  <text x="473" y="608" class="t">Zero-shot, similarity, prompt sensitivity,</text>
  <text x="473" y="626" class="t">retrieval, embedding map, probes, fine-tuning</text>
  <text x="473" y="672" class="mono">port 127.0.0.1:8002→8000 · /ui/ · /docs</text>
  <text x="473" y="692" class="s">volumes clip-data → /data · hf-cache → /hf</text>
  <text x="473" y="712" class="s">GPU reservation</text>
  <text x="473" y="740" class="lbl">API: /v1/zero-shot · /v1/similarity · /v1/galleries/…</text>

  <rect x="850" y="540" width="370" height="220" rx="12" fill="#fbf0e7" stroke="#a4572a" stroke-width="1.5"/>
  <text x="868" y="566" class="h">vlm</text>
  <text x="906" y="566" class="s">build: modules/vlm</text>
  <text x="868" y="590" class="t">Small vision-language models (SmolVLM first)</text>
  <text x="868" y="608" class="t">Decoding, tokens &amp; attention, LoRA tuning,</text>
  <text x="868" y="626" class="t">evaluation · stops after 30 min idle</text>
  <text x="868" y="672" class="mono">port 127.0.0.1:8003→8000 · /ui/ · /docs</text>
  <text x="868" y="692" class="s">volumes vlm-data → /data · hf-cache → /hf</text>
  <text x="868" y="712" class="s">GPU reservation</text>
  <text x="868" y="740" class="lbl">API: /v1/generate · /v1/attention · /v1/jobs</text>

  <!-- arrows -->
  <line x1="165" y1="188" x2="165" y2="298" stroke="#34405a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="445" y1="188" x2="300" y2="298" stroke="#34405a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="360" y1="380" x2="418" y2="380" stroke="#34405a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="362" y="372" class="s">/api</text>
  <line x1="842" y1="360" x2="898" y2="360" stroke="#c2652e" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <!-- manager to modules: HTTP -->
  <line x1="530" y1="502" x2="245" y2="538" stroke="#34405a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="630" y1="502" x2="640" y2="538" stroke="#34405a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="740" y1="502" x2="1035" y2="538" stroke="#34405a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="858" y="508" class="lbl">HTTP: yolo:8000 · clip:8000 · vlm:8000</text>
  <!-- docker engine controls modules -->
  <path d="M1060 420 L 1060 450 L 1232 450 L 1232 772 L 245 772" fill="none" stroke="#c2652e" stroke-width="1.6" stroke-dasharray="6 4"/>
  <line x1="245" y1="772" x2="245" y2="764" stroke="#c2652e" stroke-width="1.6" marker-end="url(#arrow-orange)"/>
  <line x1="640" y1="772" x2="640" y2="764" stroke="#c2652e" stroke-width="1.6" marker-end="url(#arrow-orange)"/>
  <line x1="1035" y1="772" x2="1035" y2="764" stroke="#c2652e" stroke-width="1.6" marker-end="url(#arrow-orange)"/>
  <text x="1076" y="442" class="s" fill="#c2652e">start / stop the module containers</text>

  <!-- volumes and gpu row -->
  <rect x="40" y="800" width="760" height="140" rx="12" fill="#ffffff" stroke="#9aa4b8"/>
  <text x="58" y="826" class="h">Named volumes (persist across rebuilds)</text>
  <text x="58" y="850" class="mono">web-certs      certificate for HTTPS</text>
  <text x="58" y="870" class="mono">manager-data   SQLite history, analysis pictures</text>
  <text x="58" y="890" class="mono">yolo-data      datasets, training runs, weights</text>
  <text x="420" y="850" class="mono">clip-data      galleries, probes, fine-tuned models</text>
  <text x="420" y="870" class="mono">vlm-data       instruction data, LoRA adapters</text>
  <text x="420" y="890" class="mono">hf-cache       Hugging Face models (shared by clip, vlm)</text>
  <text x="58" y="920" class="s">Containers run as a non-root user (uid 10001 for clip, vlm and the manager).</text>

  <rect x="830" y="800" width="410" height="140" rx="12" fill="#f4f7ee" stroke="#6b8f3a"/>
  <text x="848" y="826" class="h">NVIDIA GPU (shared)</text>
  <text x="848" y="850" class="t">deploy.resources.reservations.devices</text>
  <text x="848" y="870" class="t">for yolo, clip and vlm.</text>
  <text x="848" y="894" class="s">CPU only: docker-compose.cpu.yml removes the reservation.</text>
  <text x="848" y="914" class="s">One heavy job at a time per GPU; idle stop frees memory.</text>
</svg>
