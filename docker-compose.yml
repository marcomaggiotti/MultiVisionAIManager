# MultiVision AI Manager: the manager (web + API hub) and its modules.
#
# Every module is a separate web service in its own container. "docker compose up"
# creates and starts them all; afterwards the manager stops and relaunches them
# (dashboard buttons, automatically when a pipeline or the web interface needs one,
# idle stop to free GPU memory) through the Docker socket; modules.json says how.
#
#   git submodule update --init      # once: clones the YOLO module into modules/yolo
#   docker compose up -d --build     # or ./start.sh (does both), ./start.sh --cpu
#   ./start.sh down                  # stops and removes everything
#
# Web interface: http://localhost:3000
# Each module also serves its own page and API docs, e.g. http://localhost:8001/ui/ and /docs.
name: multivision

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  web:
    build: ./manager/web
    # Reachable from the whole local network: http on 3000, https on 3443 (phones and
    # tablets need https to use their camera in the Live studio).
    ports: ["${WEB_PORT:-3000}:80", "${WEB_HTTPS_PORT:-3443}:443"]
    environment:
      CERT_HOSTS: ${CERT_HOSTS:-}
    volumes: [web-certs:/etc/nginx/certs]
    depends_on: [manager-api]
    restart: unless-stopped

  manager-api:
    build:
      context: ./manager/api
      args:
        # optional extras: "azure" for the picture store in Azure Blob Storage
        PIP_EXTRAS: ${MANAGER_PIP_EXTRAS:-}
    environment:
      MANAGER_REGISTRY: /config/modules.json
      MANAGER_DOCKER_SOCKET: /var/run/docker.sock
      MANAGER_COMPOSE_PROJECT: multivision
      # analysed frames' pictures: "database" (SQLite in the manager-data volume) or "azure"
      MANAGER_PICTURE_STORE: ${MANAGER_PICTURE_STORE:-database}
      MANAGER_AZURE_STORAGE_CONNECTION_STRING: ${MANAGER_AZURE_STORAGE_CONNECTION_STRING:-}
      MANAGER_AZURE_STORAGE_CONTAINER: ${MANAGER_AZURE_STORAGE_CONTAINER:-multivision-pictures}
    volumes:
      - manager-data:/data
      - ./modules.json:/config/modules.json:ro
      # Lets the manager start/stop the module containers. Docker access is
      # root-equivalent: keep the manager API on localhost (as below).
      - /var/run/docker.sock:/var/run/docker.sock
    group_add: ["${DOCKER_GID:-0}"] # group owning the Docker socket (start.sh sets it)
    ports: ["127.0.0.1:${MANAGER_PORT:-8080}:8080"]
    restart: unless-stopped

  # YOLO detection & pose: https://github.com/marcomaggiotti/detect_image_engine,
  # cloned into modules/yolo as a git submodule (./start.sh clones it automatically).
  yolo:
    <<: *gpu
    build:
      context: ./modules/yolo
      args:
        TORCH_INDEX: ${YOLO_TORCH_INDEX:-https://download.pytorch.org/whl/cu124}
    environment:
      DETECT_MODEL_WEIGHTS: ${YOLO_WEIGHTS:-/models/yolo11n-pose.pt}
      DETECT_TARGET_CLASSES: person
      DETECT_DEVICE: ${YOLO_DEVICE:-cuda}
      DETECT_DATA_DIR: /data
    volumes: [yolo-data:/data]
    shm_size: 2gb # training data loaders
    ports: ["127.0.0.1:${YOLO_PORT:-8001}:8000"]

  clip:
    <<: *gpu
    build:
      context: ./modules/clip
      args:
        # PyTorch >= 2.6 (recent transformers refuse older). RTX 50-series: set
        # TORCH_BASE_IMAGE=pytorch/pytorch:2.8.0-cuda12.8-cudnn9-runtime in .env
        BASE: ${TORCH_BASE_IMAGE:-pytorch/pytorch:2.8.0-cuda12.6-cudnn9-runtime}
    environment:
      CLIP_MODEL_ID: ${CLIP_MODEL_ID:-openai/clip-vit-base-patch16}
      CLIP_DEVICE: ${CLIP_DEVICE:-}
    volumes: [clip-data:/data, hf-cache:/hf]
    ports: ["127.0.0.1:${CLIP_PORT:-8002}:8000"]

  vlm:
    <<: *gpu
    build:
      context: ./modules/vlm
      args:
        # PyTorch >= 2.6 (recent transformers refuse older). RTX 50-series: set
        # TORCH_BASE_IMAGE=pytorch/pytorch:2.8.0-cuda12.8-cudnn9-runtime in .env
        BASE: ${TORCH_BASE_IMAGE:-pytorch/pytorch:2.8.0-cuda12.6-cudnn9-runtime}
    environment:
      VLM_MODEL_ID: ${VLM_MODEL_ID:-HuggingFaceTB/SmolVLM-256M-Instruct}
      VLM_QUANTIZATION: ${VLM_QUANTIZATION:-none}
      VLM_DEVICE: ${VLM_DEVICE:-}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes: [vlm-data:/data, hf-cache:/hf]
    ports: ["127.0.0.1:${VLM_PORT:-8003}:8000"]

volumes:
  web-certs:
  manager-data:
  yolo-data:
  clip-data:
  vlm-data:
  hf-cache:
